services:
  # ============================================
  # GopherSentinel - AI DevOps Assistant
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gophersentinel:latest
    container_name: gopher-sentinel
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=gopher_sentinel
      - REDIS_ADDR=redis:6379
      - GIN_MODE=release
      - TZ=Asia/Shanghai
    volumes:
      - ./docs:/app/docs:ro
      - ./configs:/app/configs:ro
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gopher-network
    restart: unless-stopped

  # ============================================
  # Qdrant - Vector Database
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gopher-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - gopher-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================
  # Redis - Cache & Short-term Memory
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: gopher-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - gopher-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gopher-network:
    name: gopher-network

volumes:
  qdrant-data:
    name: gopher-qdrant-data
  redis-data:
    name: gopher-redis-data
