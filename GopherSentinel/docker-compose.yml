version: '3.8'

services:
  # ============================================
  # GopherSentinel - AI DevOps Assistant
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gopher-sentinel
    ports:
      - "8080:8080"
    environment:
      # Ollama Configuration
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      # Qdrant Configuration
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=gopher_sentinel
      # Redis Configuration
      - REDIS_ADDR=redis:6379
      # Application Settings
      - GIN_MODE=release
      - TZ=Asia/Shanghai
    volumes:
      # Mount local docs for indexing
      - ./docs:/app/docs:ro
      # Config override
      - ./configs:/app/configs:ro
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gopher-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Ollama - Local LLM Runtime
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: gopher-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - gopher-network
    restart: unless-stopped
    profiles:
      - cpu  # Use: docker-compose --profile cpu up
      - all   # Default (includes GPU)

  # ============================================
  # Qdrant - Vector Database
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gopher-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - gopher-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis - Cache & Short-term Memory
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: gopher-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - gopher-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Loki (Optional) - Log Aggregation
  # ============================================
  loki:
    image: grafana/loki:latest
    container_name: gopher-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/data
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - gopher-network
    restart: unless-stopped
    profiles:
      - monitoring

  # ============================================
  # Grafana (Optional) - Visualization
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: gopher-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - gopher-network
    restart: unless-stopped
    profiles:
      - monitoring

  # ============================================
  # Langfuse (Optional) - Observability
  # ============================================
  langfuse:
    image: langfuse/langfuse:latest
    container_name: gopher-langfuse
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=change-in-production
      - SALT=change-in-production
      - SECRET_KEY=change-in-production
    depends_on:
      langfuse-db:
        condition: service_healthy
    networks:
      - gopher-network
    restart: unless-stopped
    profiles:
      - observability

  langfuse-db:
    image: postgres:15-alpine
    container_name: gopher-langfuse-db
    environment:
      - POSTGRES_DB=langfuse
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - langfuse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gopher-network
    restart: unless-stopped
    profiles:
      - observability

# ============================================
# Networks
# ============================================
networks:
  gopher-network:
    driver: bridge
    name: gopher-network

# ============================================
# Volumes
# ============================================
volumes:
  ollama-data:
    name: gopher-ollama-data
  qdrant-data:
    name: gopher-qdrant-data
  redis-data:
    name: gopher-redis-data
  loki-data:
    name: gopher-loki-data
  grafana-data:
    name: gopher-grafana-data
  langfuse-data:
    name: gopher-langfuse-data
